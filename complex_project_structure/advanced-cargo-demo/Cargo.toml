[package]
name = "advanced-cargo-demo"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A comprehensive demo showcasing Cargo.toml features"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/advanced-cargo-demo"
readme = "README.md"
keywords = ["demo", "cargo", "tutorial", "example"]
categories = ["development-tools", "learning"]

# Build configuration
[package.metadata]
maintained-by = "Your Name"
documentation = "https://docs.rs/advanced-cargo-demo"

# Binary and library targets
[[bin]]
name = "advanced-cargo-demo"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "demo_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]  # 生成标准库和动态库

# Dependencies - 不同类型展示
[dependencies]
# 基础依赖
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# 可选依赖
regex = { version = "1.10", optional = true }
chrono = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }

# Git依赖
tokio = { git = "https://github.com/tokio-rs/tokio", branch = "master", optional = true }

# 路径依赖（本地开发）
# my_local_crate = { path = "../my-crate" }

# 条件编译依赖
[target.'cfg(windows)'.dependencies]
winapi = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 开发依赖
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
pretty_assertions = "1.4"

# 构建依赖
[build-dependencies]
cc = "1.0"
walkdir = "2"

# 构建脚本
[package.metadata.build]
build-command = "cargo build --release"

# 特性定义
[features]
default = ["basic", "cli"]
basic = ["regex", "chrono"]  # 基础功能
advanced = ["rand", "tokio"]  # 高级功能
full = ["basic", "advanced", "cli"]
cli = []  # CLI功能
experimental = []  # 实验性功能

# 配置文件支持
[profile.dev]
opt-level = 0
debug = true
rpath = false
lto = false
debug-assertions = true
codegen-units = 256
panic = 'unwind'

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'

[profile.bench]
inherits = "release"
debug = true

# 工作区配置（如果是工作区的根）
[workspace]
members = [
    # "crates/*"
]
exclude = [
    "tools"
]

# 补丁源（替换依赖源）
[patch.crates-io]
# reqwest = { git = "https://github.com/seanmonstar/reqwest" }

# 替换注册源
[source.crates-io]
replace-with = 'ustc'

[source.ustc]
registry = "https://mirrors.ustc.edu.cn/crates.io-index"

# 防止意外发布
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]