[package]
name = "my-cargo-demo"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <email@example.com>"]
description = "一个简单的Cargo.toml演示项目"
license = "MIT"

# 依赖配置
[dependencies]
# 基础依赖
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 可选依赖
regex = { version = "1.10", optional = true }
rand = { version = "0.8", optional = true }

# 开发依赖（只在测试时使用）
[dev-dependencies]
tempfile = "3.8"

# 特性定义
[features]
default = ["basic"]    # 默认启用basic特性
basic = ["regex"]      # 基础功能
full = ["basic", "rand"]  # 完整功能

# 优化配置
[profile.release]
opt-level = 3          # 最高优化级别
lto = true            # 链接时优化